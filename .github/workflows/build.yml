name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # only the tag-triggered release step writes

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LAYBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret LAYBOARD_KEYSTORE_BASE64 is missing; refusing to publish an APK signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/layboard.jks"
          echo "LAYBOARD_KEYSTORE_FILE=$RUNNER_TEMP/layboard.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          LAYBOARD_KEYSTORE_PASSWORD: ${{ secrets.LAYBOARD_KEYSTORE_PASSWORD }}
          LAYBOARD_KEY_ALIAS: ${{ secrets.LAYBOARD_KEY_ALIAS }}
          LAYBOARD_KEY_PASSWORD: ${{ secrets.LAYBOARD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Report APK size
        run: ls -l app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: layboard-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Layboard-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Layboard-${GITHUB_REF_NAME}.apk" \
            --title "Layboard ${GITHUB_REF_NAME}" --generate-notes
